name: Deploy to server

# Auto-deploy: on every push to the site branch, SSH into the VPS and
# git pull + rebuild the Docker container. Recreates Vercel's push-to-deploy.
# Requires three repo secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.

on:
  push:
    branches: [claude/affectionate-lovelace-b3f6do]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/gangrey
            git pull --ff-only
            docker compose up --build -d
            docker image prune -f
