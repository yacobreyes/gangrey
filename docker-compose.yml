services:
  imago:
    build:
      context: .
      args:
        # Baked into the client bundle at build time. deploy.sh exports it from
        # .env.selfhost before building; empty → no analytics.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        # Per-deploy id for version-skew protection. deploy.sh exports the git
        # short SHA before building; empty → skew protection off (dev).
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    ports:
      - "3000:3000"
    volumes:
      # Everything the CMS owns lives here: imago.db (SQLite) + media uploads.
      # Backing up the site = copying this one folder.
      - ./data:/data
    environment:
      STORAGE_BACKEND: sqlite
      DATA_DIR: /data
      # Auth (required for the admin):
      #   NEXTAUTH_SECRET: generate with `openssl rand -base64 32`
      #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: admin Google sign-in
      #   ADMIN_GOOGLE_EMAIL: the bootstrap owner's email
      # Optional integrations (features disable gracefully without them):
      #   STRIPE_SECRET_KEY, GANGREY_RESEND_KEY, NEWSLETTER_FROM
      # Offsite backup (continuous SQLite replication). Unset → no replication,
      # app boots normally. See SELFHOST.md "Backups".
      #   LITESTREAM_REPLICA_URL      e.g. s3://gangrey-backups/imago
      #   LITESTREAM_ENDPOINT         only for non-AWS S3 (R2, B2, Hetzner)
      #   LITESTREAM_REGION
      #   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
      # NEXTAUTH_URL is set in .env.selfhost (e.g. https://gangrey.org in prod,
      # http://localhost:3000 locally) so this tracked file stays environment-
      # agnostic and doesn't conflict on pull.
    env_file:
      - .env.selfhost
    restart: unless-stopped
